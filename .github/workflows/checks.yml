name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Prepare Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock -r requirements-dev.txt
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Backend tests
        run: .venv/bin/python -m pytest -q
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Package source and frontend
        run: .venv/bin/python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: MathMaster-local
          path: artifacts/MathMaster-*-local.zip*
